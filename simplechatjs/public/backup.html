<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SimpleChat</title>
    <style>
        :root{
            --bg:#0f1724;
            --panel:#0b1220;
            --accent:#2563eb;
            --muted:#94a3b8;
            --user:#0ea5a4;
            --bot:#111827;
            --white:#fff;
        }
        html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;}
        body{background:linear-gradient(180deg,#071029 0%, var(--bg) 100%);display:flex;align-items:center;justify-content:center;padding:24px;color:var(--white);}
        .chat {
            width:100%;
            max-width:820px;
            height:640px;
            background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
            border:1px solid rgba(255,255,255,0.04);
            border-radius:12px;
            display:flex;
            flex-direction:column;
            overflow:hidden;
            box-shadow:0 8px 32px rgba(2,6,23,0.6);
        }
        .chat__header{
            padding:16px 20px;
            display:flex;
            align-items:center;
            gap:12px;
            border-bottom:1px solid rgba(255,255,255,0.03);
            background:linear-gradient(180deg, rgba(255,255,255,0.012), transparent);
        }
        .logo{
            width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;
            box-shadow:0 2px 8px rgba(37,99,235,0.16);
        }
        .title{font-size:16px;font-weight:600;}
        .subtitle{color:var(--muted);font-size:13px;}
        .chat__body{
            flex:1;
            padding:18px;
            overflow:auto;
            display:flex;
            flex-direction:column;
            gap:12px;
            background-image:linear-gradient(rgba(255,255,255,0.002), rgba(255,255,255,0));
        }
        .messages{display:flex;flex-direction:column;gap:10px;align-self:stretch;}
        .msg{
            max-width:78%;
            padding:10px 12px;
            border-radius:12px;
            font-size:14px;
            line-height:1.35;
            box-shadow:0 1px 0 rgba(255,255,255,0.02) inset;
            word-wrap:break-word;
        }
        .msg.user{
            align-self:flex-end;
            background:linear-gradient(180deg,var(--user), #0bb4b1);
            color:var(--white);
            border-bottom-right-radius:6px;
        }
        .msg.bot{
            align-self:flex-start;
            background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            color:var(--muted);
            border-bottom-left-radius:6px;
            border:1px solid rgba(255,255,255,0.02);
        }
        .meta{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted);}
        .time{opacity:0.9}
        .chat__footer{
            padding:12px;
            border-top:1px solid rgba(255,255,255,0.03);
            display:flex;
            gap:10px;
            align-items:center;
            background:linear-gradient(180deg, transparent, rgba(255,255,255,0.01));
        }
        .input{
            flex:1;
            display:flex;
            gap:8px;
            align-items:center;
            background:rgba(255,255,255,0.02);
            padding:8px;
            border-radius:10px;
            border:1px solid rgba(255,255,255,0.02);
        }
        .input textarea{
            width:100%;
            resize:none;
            border:0;
            outline:0;
            background:transparent;
            color:var(--white);
            font-size:14px;
            line-height:1.2;
            max-height:120px;
            padding:6px 4px;
        }
        .btn{
            background:var(--accent);
            color:white;
            border:0;
            padding:10px 14px;
            border-radius:10px;
            cursor:pointer;
            font-weight:600;
            box-shadow:0 6px 18px rgba(37,99,235,0.12);
        }
        .btn.secondary{
            background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,0.03);box-shadow:none;
        }
        .empty{
            margin:auto;
            color:var(--muted);
            text-align:center;
            padding:40px 20px;
        }
        @media (max-width:520px){
            .chat{height:100vh;border-radius:0;}
            .logo{width:36px;height:36px;}
        }
    </style>
</head>
<body>
    <main class="chat" role="application" aria-label="Simple chat">
        <header class="chat__header">
            <div class="logo" aria-hidden>SC</div>
            <div>
                <div class="title">SimpleChat</div>
                <div class="subtitle">A minimal local chat interface</div>
            </div>
            <div style="margin-left:auto;display:flex;gap:8px;">
                <button id="clearBtn" class="btn secondary" title="Clear chat">Clear</button>
            </div>
        </header>

        <section class="chat__body" id="body">
            <div class="messages" id="messages" role="log" aria-live="polite" aria-atomic="false">
                <div class="empty" id="empty">No messages yet. Type something below and press Send or Enter.</div>
            </div>
        </section>

        <form id="form" class="chat__footer" onsubmit="return false;">
            <div class="input" role="search">
                <textarea id="input" rows="1" placeholder="Type a message…" aria-label="Message input"></textarea>
            </div>
            <button id="sendBtn" class="btn" type="submit">Send</button>
        </form>
    </main>

    <script>
        // Simple local chat UI. Messages are not sent to any server.
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const emptyEl = document.getElementById('empty');

        function timeNow(){
            const d = new Date();
            return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        function appendMessage(text, sender='bot'){
            if (!text) return;
            if (emptyEl) { emptyEl.remove(); }
            const wrap = document.createElement('div');
            wrap.className = 'messageWrap';
            const msg = document.createElement('div');
            msg.className = 'msg ' + (sender === 'user' ? 'user' : 'bot');
            msg.textContent = text;
            const meta = document.createElement('div');
            meta.className = 'meta';
            const who = document.createElement('div');
            who.textContent = sender === 'user' ? 'You' : 'SimpleChat';
            const time = document.createElement('div');
            time.className = 'time';
            time.textContent = timeNow();
            meta.appendChild(who);
            meta.appendChild(time);
            wrap.appendChild(msg);
            wrap.appendChild(meta);
            messagesEl.appendChild(wrap);
            // Auto-scroll to bottom
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function send(){
            const text = inputEl.value.trim();
            if (!text) return;
            appendMessage(text, 'user');
            inputEl.value = '';
            inputEl.focus();

            // Demo: simple echo bot reply with a tiny delay
            setTimeout(() => {
                appendMessage('Echo: ' + text, 'bot');
            }, 500 + Math.random() * 700);
        }

        sendBtn.addEventListener('click', (e) => { e.preventDefault(); send(); });

        // Enter to send, Shift+Enter for newline
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        clearBtn.addEventListener('click', () => {
            messagesEl.innerHTML = '<div class="empty" id="empty">No messages yet. Type something below and press Send or Enter.</div>';
            inputEl.focus();
        });

        // Small UI nicety: auto-expand textarea
        function resizeTextarea(){
            inputEl.style.height = 'auto';
            inputEl.style.height = (inputEl.scrollHeight) + 'px';
        }
        inputEl.addEventListener('input', resizeTextarea);
        window.addEventListener('load', () => { inputEl.focus(); resizeTextarea(); });
    </script>
</body>
</html></div></section></div>
