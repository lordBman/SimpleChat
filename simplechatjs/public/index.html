<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SimpleChat - Template</title>
    <style>
        :root{
            --bg:#f4f7fb;
            --sidebar:#ffffff;
            --accent:#2b90ff;
            --muted:#9aa6b2;
            --me:#daf1ff;
            --them:#ffffff;
            --radius:10px;
            --shadow: 0 6px 18px rgba(34,44,60,0.08);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            margin:0;
            background:var(--bg);
            color:#24303a;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            width:100dvw;
            height: 100dvh;
        }

        .app{
            width:100%;
            height: 100%;
            background:linear-gradient(180deg, #ffffff, #fcfdff);
            display:flex;
            border-radius:14px;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar{
            width:350px;
            background:var(--sidebar);
            border-right:1px solid #eef3f7;
            padding:16px;
            display:flex;
            flex-direction:column;
            gap:12px;
        }

        .brand{
            display:flex;
            align-items:center;
            gap:12px;
        }
        .logo{
            width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#6bd3ff);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:18px;
        }
        .brand h1{font-size:16px;margin:0}
        .search{
            display:flex;
            gap:8px;
            align-items:center;
        }
        .search input{
            flex:1;padding:10px 12px;border-radius:10px;border:1px solid #e6eef5;background:#f9fbfd;
            outline:none;
        }

        .list-section{overflow:auto;padding-bottom:8px}
        .list-title{font-size:12px;color:var(--muted);padding:6px 2px;margin-top:8px}
        .person{
            display:flex;
            gap:12px;
            padding:10px;
            border-radius:10px;
            align-items:center;
            cursor:pointer;
            transition:background .12s;
        }
        .person:hover{background:#f5fbff}
        .person.active{background:#eef8ff;border-left:3px solid var(--accent);padding-left:9px}
        .avatar{
            width:44px;height:44px;border-radius:10px;background:#e7f2ff;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;
            position:relative;
        }
        .badge{
            background:#ff5c7c;
            color:white;
            font-size:11px;
            padding:3px 6px;
            border-radius:999px;
        }
        .meta{flex:1}
        .meta .name{font-weight:600}
        .meta .preview{font-size:13px;color:var(--muted);margin-top:4px}

        /* Main chat */
        .chat{
            flex:1;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff,#fbfeff);
        }
        .chat-header{
            padding:14px 18px;border-bottom:1px solid #eef3f7;display:flex;align-items:center;gap:12px;
            background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6));
        }
        .chat-header .title{font-weight:700}
        .chat-body{
            padding:18px;
            flex:1;
            overflow-y:auto;
            overflow-x: hidden;
            display:flex;
            flex-direction:column;
            gap:12px;
            background:linear-gradient(180deg,#fbfeff,#f7fbff);
        }
        .messages{display:flex;flex-direction:column;gap:10px;max-width:900px}
        .msg{padding:10px 14px;border-radius:14px;max-width:70%;box-shadow:0 2px 6px rgba(30,40,50,0.03);font-size:14px}
        .msg-them{background:var(--them);align-self:flex-start;border-radius:14px 14px 14px 6px}
        .msg-me{background:var(--me);align-self:flex-end;border-radius:14px 14px 6px 14px}
        .msg small{display:block;margin-top:6px;font-size:11px;color:var(--muted)}

        .chat-input{
            padding:12px 16px;border-top:1px solid #eef3f7;display:flex;gap:8px;align-items:center;background:transparent;
        }
        .chat-input textarea{
            resize:none;flex:1;padding:10px 12px;border-radius:10px;border:1px solid #e6eef5;height:48px;outline:none;background:white;
        }
        .btn{
            background:var(--accent);color:white;border:none;padding:10px 14px;border-radius:10px;cursor:pointer;
        }

        /* Responsive */
        @media (max-width:800px){
            .app{flex-direction:column;height:auto}
            .sidebar{width:100%;display:flex;overflow:auto}
            .chat{order:2}
        }
    </style>
</head>
<body>
    <div class="app" role="application" aria-label="Simple chat application">
        <aside class="sidebar" aria-label="Contacts and groups">
            <div class="brand">
                <div class="logo">SC</div>
                <h1>SimpleChat</h1>
            </div>

            <div class="search" role="search">
                <input id="search" placeholder="Search friends or groups..." aria-label="Search" />
            </div>

            <div class="list-section" id="friends-section" aria-label="Friends">
                <div class="list-title">Friends</div>
                <div id="friends-list">
                    <div class="person" tabindex="0" data-id="alice" data-type="user">
                        <div class="avatar">A</div>
                        <div class="meta">
                            <div class="name">Alice</div>
                            <div class="preview">Hey! Are we still on for tonight?</div>
                        </div>
                        <div class="badge">2</div>
                    </div>

                    <div class="person" tabindex="0" data-id="bob" data-type="user">
                        <div class="avatar">B</div>
                        <div class="meta">
                            <div class="name">Bob</div>
                            <div class="preview">Sent a file • 11:04</div>
                        </div>
                    </div>

                    <div class="person" tabindex="0" data-id="charlie" data-type="user">
                        <div class="avatar">C</div>
                        <div class="meta">
                            <div class="name">Charlie</div>
                            <div class="preview">On my way</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="list-section" id="groups-section" aria-label="Groups">
                <div class="list-title">Groups</div>
                <div id="groups-list">
                    <div class="person" tabindex="0" data-id="family" data-type="group">
                        <div class="avatar">F</div>
                        <div class="meta">
                            <div class="name">Family</div>
                            <div class="preview">Mom: See you Sunday</div>
                        </div>
                    </div>

                    <div class="person" tabindex="0" data-id="work" data-type="group">
                        <div class="avatar">W</div>
                        <div class="meta">
                            <div class="name">Work</div>
                            <div class="preview">Project deadline moved</div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="chat" aria-live="polite">
            <div class="chat-header" id="chat-header">
                <div class="avatar" id="header-avatar">—</div>
                <div>
                    <div class="title" id="header-name">Select a conversation</div>
                    <div class="subtitle" id="header-sub">Choose a friend or group on the left</div>
                </div>
            </div>

            <div class="chat-body">
                <div class="messages" id="messages" aria-label="Messages">
                    <!-- messages inserted here -->
                </div>
            </div>

            <div class="chat-input">
                <textarea id="message-input" placeholder="Type a message..." aria-label="Message input"></textarea>
                <button class="btn" id="send-btn" aria-label="Send message">Send</button>
            </div>
        </main>
    </div>
    <script src="../test/scripts/index.ts"></script>
</body>
</html></div>
